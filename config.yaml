# TRONostr runtime configuration

tron:
  fullHost: "https://api.trongrid.io"
  eventServer: "https://api.trongrid.io"
  solidityNode: "https://api.trongrid.io"
  pollIntervalMs: 3000
  # Optional fixed starting point used only when checkpoint restore is disabled or empty.
  # startBlock: 57000000
  maxBackoffMs: 30000
  backoffMultiplier: 2
  jitterMs: 250
  checkpoint:
    enabled: false
    path: "./storage/tronostr-checkpoints.json"
    key: "mainnet-default"
  # Public TronGrid works without a key but is rate limited. TRON_PRO_API_KEY in .env is optional.
  
nostr:
  # Publishing to relays only happens when NOSTR_PRIVATE_KEY is set. Without it TRONostr runs in
  # read-only local mode (JSON API / JSONL / webhook).
  enabled: true
  relays:
    - "wss://relay.damus.io"
    - "wss://nos.lol"
    - "wss://relay.nostr.band"
  kindRange:
    start: 6500
    end: 6599
  reconnect:
    enabled: true
    initialDelayMs: 1000
    maxDelayMs: 30000
    multiplier: 2
    jitterMs: 250
  # Per-relay publishing throttle.
  rateLimit:
    eventsPerMinute: 10
    queueSize: 100

# Small read-only JSON API over recent events, plus the static "The Tron Report" dashboard at "/".
# In containers set TRONOSTR_API_HOST=0.0.0.0 (the Dockerfile does). PORT is honored too.
api:
  enabled: true
  host: "127.0.0.1"
  port: 8788
  corsOrigin: "*"
  storeCapacity: 5000
  dashboard: true

# Persistent history (SQLite via node:sqlite, Node >= 22.13). Powers /api/v1/history and
# /api/v1/trends. Env overrides: TRONOSTR_DB_PATH, TRONOSTR_RETENTION_DAYS, TRONOSTR_HISTORY=off.
storage:
  sqlite:
    enabled: true
    path: "./storage/tronostr.db"
    retentionDays: 30
    # Per-block telemetry (~28,800 rows/day) only feeds the hourly aggregates unless this is true.
    storeBlockMetrics: false

output:
  jsonl:
    enabled: false
    path: "./storage/tronostr-events.jsonl"
  webhook:
    enabled: false
    url: "http://127.0.0.1:8787/tronostr"
    timeoutMs: 5000
    headers: {}

detectors:
  whaleTransfer:
    enabled: true
    trxThreshold: 1000000
    usdtThreshold: 100000
    usdtContract: "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t"
  
  blockMetrics:
    enabled: true

  # Stake 2.0 energy/bandwidth delegations (the TRON "energy rental" market).
  # Threshold is the staked TRX backing the (un)delegation.
  resourceDelegation:
    enabled: true
    trxThreshold: 1000000
    resources: ["ENERGY", "BANDWIDTH"]
    includeUndelegations: true

  # Inflow/outflow to labeled wallets. usePublicLabels adds the bundled, source-cited Tronscan public
  # tags in src/labels/publicLabels.ts (13 addresses; see docs/LABELS.md for caveats). Add your own
  # entries only if you can cite the attribution (e.g. an exchange's proof-of-reserves list).
  exchangeFlow:
    enabled: true
    usePublicLabels: true
    trxThreshold: 100000
    usdtThreshold: 50000
    addresses: []
    # - address: "T..."
    #   label: "ExampleExchange hot wallet"
    #   source: "https://example.com/proof-of-reserves"

